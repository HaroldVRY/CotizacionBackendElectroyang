<table class="table">
  <thead>
    <tr>
      <th>ITEM</th>
      <th>CANT</th>
      <th>DESCRIPCIÓN</th>
      <th class="text-right">PRECIO UNIT(S/.)</th>
      <th class="text-right">PRECIO TOTAL(S/.)</th>
    </tr>
  </thead>
  <tbody>
    ${rows}
  </tbody>
  <tfoot>
    <tr>
      <td colspan="4" class="text-right"><strong>SUBTOTAL:</strong></td>
      <td class="text-right"><strong>${cotizacion.subtotal}</strong></td>
    </tr>
    <tr>
      <td colspan="4" class="text-right"><strong>IGV (18%):</strong></td>
      <td class="text-right"><strong>${cotizacion.igv}</strong></td>
    </tr>
    <tr class="total-row">
      <td colspan="4" class="text-right"><strong>TOTAL:</strong></td>
      <td class="text-right"><strong>${cotizacion.total}</strong></td>
    </tr>
  </tfoot>
</table>

<div class="observaciones"><strong>Observaciones:</strong> ${cotizacion.observaciones}</div>
